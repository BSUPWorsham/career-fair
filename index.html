<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Career Fair Employer Directory</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <style>
        /* Custom DataTables Styling Adjustments */
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            padding: 0.4rem 0.8rem;
            margin-left: 0.5rem;
        }
        .dataTables_wrapper .dataTables_length select {
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            padding: 0.3rem;
        }
        table.dataTable tbody tr:hover {
            background-color: #f1f5f9 !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

<div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md p-6 md:p-8">
    <!-- Header -->
    <header class="border-b border-slate-200 pb-6 mb-6">
        <h1 class="text-3xl font-bold text-blue-900">College of Engineering Career Fair</h1>
        <p class="text-slate-600 mt-1">Browse attending employers, open positions, target majors, and booth locations.</p>
    </header>

    <!-- Interactive Table -->
    <div class="overflow-x-auto">
        <table id="directoryTable" class="w-full text-left border-collapse">
            <thead class="bg-slate-100 text-slate-700">
            <tr>
                <th class="p-3">Employer</th>
                <th class="p-3">Booth</th>
                <th class="p-3">Industry</th>
                <th class="p-3">Hiring For</th>
                <th class="p-3">Target Majors</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
            <!-- Populated dynamically via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<!-- JavaScript Dependencies -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
    $(document).ready(function() {
        // Fetch the cleaned JSON generated by python script
        fetch('./employers.json')
            .then(res => res.json())
            .then(data => {
                $('#directoryTable').DataTable({
                    data: data,
                    columns: [
                        {
                            data: 'name',
                            render: function(data, type, row) {
                                if (row.website) {
                                    let url = row.website.startsWith('http') ? row.website : 'https://' + row.website;
                                    return `<a href="${url}" target="_blank" rel="noopener" class="font-semibold text-blue-600 hover:underline">${data}</a>`;
                                }
                                return `<span class="font-semibold text-slate-900">${data}</span>`;
                            }
                        },
                        {
                            data: 'booth',
                            render: function(data) {
                                return `<span class="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full">${data}</span>`;
                            }
                        },
                        { data: 'industry' },
                        { data: 'job_types' },
                        { data: 'majors' }
                    ],
                    pageLength: 25,
                    responsive: true,
                    language: {
                        search: "Search Employers or Keywords:"
                    }
                });
            })
            .catch(err => {
                console.error("Could not load employers.json", err);
                $('#directoryTable tbody').html('<tr><td colspan="5" class="text-center text-red-500 py-4">Failed to load employer directory. Please run the parse_csv.py script.</td></tr>');
            });
    });
</script>
</body>
</html>
