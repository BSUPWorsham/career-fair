<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boise State College of Engineering - Career Fair Directory</title>

    <!-- Tailwind CSS & DataTables CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                bsuBlue: '#0033A0',
                bsuOrange: '#D64527',
              }
            }
          }
        }
    </script>

    <style>
        table.dataTable th,
        table.dataTable td {
          padding: 8px 10px !important;
          font-size: 0.8125rem;
          vertical-align: middle;
        }

        .cell-truncate {
          max-width: 180px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .dataTables_wrapper .dataTables_filter input {
          border: 1px solid #cbd5e1;
          border-radius: 0.375rem;
          padding: 0.3rem 0.6rem;
          margin-left: 0.5rem;
          outline: none;
        }
        .dataTables_wrapper .dataTables_filter input:focus {
          border-color: #0033A0;
          box-shadow: 0 0 0 2px rgba(0, 51, 160, 0.2);
        }
        .dataTables_wrapper .dataTables_length select {
          border: 1px solid #cbd5e1;
          border-radius: 0.375rem;
          padding: 0.2rem 0.5rem;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
          background: #0033A0 !important;
          color: white !important;
          border: 1px solid #0033A0 !important;
          border-radius: 0.375rem;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
          background: #D64527 !important;
          color: white !important;
          border: 1px solid #D64527 !important;
          border-radius: 0.375rem;
        }
        table.dataTable tbody tr:hover {
          background-color: #f8fafc !important;
        }
        table.dataTable thead th {
          border-bottom: 2px solid #0033A0 !important;
          white-space: nowrap;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 md:p-6">

<div class="max-w-[98%] mx-auto bg-white rounded-xl shadow-lg border-t-8 border-bsuOrange overflow-hidden">

    <!-- Header Banner -->
    <header class="bg-bsuBlue text-white p-5 md:p-6">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
            <div>
                <span class="text-bsuOrange font-bold uppercase tracking-widest text-xs">Boise State University</span>
                <h1 class="text-2xl font-extrabold tracking-tight mt-0.5">College of Engineering Career Fair</h1>
                <p class="text-blue-100 text-xs mt-0.5">Attending Employers Directory & Position Details</p>
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <div class="p-3 md:p-5">
        <div class="overflow-x-auto">
            <table id="directoryTable" class="w-full text-left border-collapse display whitespace-nowrap">
                <thead class="bg-slate-50 text-bsuBlue text-xs uppercase font-bold">
                <tr>
                    <th>Employer Name</th>
                    <th>Industry</th>
                    <th>Website</th>
                    <th>Division</th>
                    <th>Employment Types</th>
                    <th>Major Groups</th>
                    <th>Combined Majors</th>
                    <th>Job Types</th>
                    <th>School Years</th>
                    <th>US Work Auth</th>
                    <th>OPT/CPT</th>
                    <th>Sponsor</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                <!-- Data loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Libraries -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
    $(document).ready(function() {
      function renderBadge(val) {
        if (val === true) {
          return `<span class="inline-block bg-emerald-50 text-emerald-700 border-emerald-200 text-xs px-2 py-0.5 rounded-full border font-semibold">Yes</span>`;
        } else if (val === false) {
          return `<span class="inline-block bg-slate-100 text-slate-500 border-slate-200 text-xs px-2 py-0.5 rounded-full border font-medium">No</span>`;
        }
        return `<span class="text-slate-400 font-normal">${val || 'N/A'}</span>`;
      }

      function renderTruncated(text) {
        if (!text) return '<span class="text-slate-400">N/A</span>';
        let clean = $('<div>').text(text).html();
        return `<div class="cell-truncate" title="${clean}">${clean}</div>`;
      }

      fetch('./employers.json')
        .then(res => res.json())
        .then(data => {
          $('#directoryTable').DataTable({
            data: data,
            autoWidth: false,
            columns: [
              {
                data: row => row.employer_name || row.name || '',
                className: 'font-bold text-slate-900'
              },
              {
                data: row => row.employer_industry || row.industry || '',
                render: renderTruncated
              },
              {
                data: row => row.website || '',
                render: function(data) {
                  if (!data) return '<span class="text-slate-400">N/A</span>';
                  let url = data.startsWith('http') ? data : 'https://' + data;
                  return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-bsuBlue hover:text-bsuOrange hover:underline font-semibold">${data}</a>`;
                }
              },
              { data: row => row.division || '', render: renderTruncated },
              { data: row => row.employment_types || '' },
              { data: row => row.major_groups || '', render: renderTruncated },
              { data: row => row.combined_majors || '', render: renderTruncated },
              { data: row => row.job_types || '' },
              { data: row => row.school_years || '', render: renderTruncated },
              { data: row => row.us_work_authorization_required, render: renderBadge },
              { data: row => row.accepts_opt_cpt, render: renderBadge },
              { data: row => row.willing_to_sponsor, render: renderBadge }
            ],
            pageLength: 25,
            responsive: false,
            scrollX: true,
            language: {
              search: "Filter Directory:",
              searchPlaceholder: "Search major, industry, or company..."
            }
          });
        })
        .catch(err => {
          console.error("Error loading employers.json:", err);
          $('tbody').html('<tr><td colspan="12" class="p-4 text-center text-red-600 font-semibold">Failed to load directory data. Please ensure employers.json exists.</td></tr>');
        });
    });
</script>
</body>
</html>
