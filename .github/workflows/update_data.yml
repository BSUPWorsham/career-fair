name: Auto-Update Career Fair Directory

on:
  schedule:
    # Runs automatically every morning at 7:00 AM UTC (1:00 AM MDT)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          HANDSHAKE_COOKIE: ${{ secrets.HANDSHAKE_COOKIE }}
        run: python build_site.py

      - name: Commit and Push Updated index.html
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Auto-update career fair data" || exit 0
          git push